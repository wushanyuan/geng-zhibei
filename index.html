<style>
/* ===== 基础变量 ===== */
:root{
  --paper:#f7f4ec;
  --paper-2:#fffdf7;
  --ink:#1d1c1a;
  --ink-soft:#5d594f;
  --line:#ded7c6;
  --red:#cf3f2f;
  --red-soft:#fdebe7;
  --green:#2d6a5f;
  --green-soft:#e6f0ed;
  --blue:#2b4a8b;
  --shadow:0 10px 30px rgba(29,28,26,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 12% 0%, #fff9ef 0%, transparent 45%),
    radial-gradient(circle at 88% 8%, #efeee6 0%, transparent 40%),
    var(--paper);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.65;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px;}

/* ===== 顶部大标识 ===== */
.hero{position:relative;padding:64px 0 40px;text-align:center;overflow:hidden;}
.hero:before{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:38px 38px;opacity:.35;
  mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 72%);
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 72%);
}
.hero-inner{position:relative;}
.logo{display:inline-flex;align-items:center;gap:16px;}
.compass{
  width:clamp(46px,7vw,74px);height:clamp(46px,7vw,74px);flex:none;
  display:grid;place-items:center;border-radius:50%;
  border:2px solid var(--ink);background:var(--paper-2);
  box-shadow:6px 6px 0 rgba(29,28,26,.12);
}
.compass svg{width:76%;height:76%;}
.brand{
  font-size:clamp(52px,11vw,116px);font-weight:900;letter-spacing:.06em;
  line-height:1;margin:0;
  font-family:"Songti SC","STSong","Noto Serif SC",serif;
}
.brand span:nth-child(2){color:var(--red);}
.slogan{
  margin:18px 0 0;font-size:clamp(13px,1.6vw,17px);color:var(--ink-soft);letter-spacing:.14em;
}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:26px;}
.stat{
  background:var(--paper-2);border:1px solid var(--line);border-radius:2px;
  padding:10px 22px;min-width:112px;box-shadow:4px 4px 0 rgba(29,28,26,.06);
}
.stat b{display:block;font-size:22px;line-height:1.2;letter-spacing:.02em;}
.stat span{font-size:12px;color:var(--ink-soft);letter-spacing:.08em;}
.stat.bad b{color:var(--red);}

/* ===== 通用卡片 ===== */
.card{
  background:var(--paper-2);border:1px solid var(--line);border-radius:4px;
  box-shadow:var(--shadow);padding:clamp(20px,3vw,34px);
}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.sec-head h2{
  font-size:clamp(20px,2.6vw,26px);margin:0;font-weight:800;letter-spacing:.04em;
  border-left:5px solid var(--red);padding-left:12px;
}
.sec-head .hint{font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em;}

/* ===== 输入区 ===== */
.tool{margin-top:34px;}
.field{position:relative;margin-top:16px;}
textarea{
  width:100%;min-height:132px;resize:vertical;padding:16px 18px;
  border:1px solid var(--line);border-radius:3px;background:#fff;
  font:inherit;font-size:15px;color:var(--ink);outline:none;line-height:1.8;
  transition:border-color .2s,box-shadow .2s;
}
textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(207,63,47,.12);}
textarea::placeholder{color:#a9a292;}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center;}
.btn{
  border:1.5px solid var(--ink);background:var(--ink);color:#fff;
  padding:11px 26px;border-radius:2px;font:inherit;font-size:15px;font-weight:700;
  letter-spacing:.06em;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s;
  box-shadow:4px 4px 0 rgba(29,28,26,.16);
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 rgba(29,28,26,.2);}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(29,28,26,.18);}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none;font-weight:500;}
.btn.ghost:hover{background:#fff;border-color:var(--ink);}
.tip{font-size:12px;color:var(--ink-soft);letter-spacing:.04em;}

/* ===== 识别结果 ===== */
.result{margin-top:26px;display:none;}
.result.on{display:block;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.sentence{
  border-left:4px solid var(--line);background:#fff;padding:14px 16px;border-radius:2px;
  font-size:15px;line-height:1.9;word-break:break-word;
}
.mk{padding:1px 3px;border-radius:2px;font-weight:700;}
.mk.bad{background:var(--red-soft);color:var(--red);border-bottom:2px solid var(--red);}
.mk.good{background:var(--green-soft);color:var(--green);border-bottom:2px solid var(--green);}
.sum-bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px;}
.chip{
  font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);
  background:#fff;letter-spacing:.04em;
}
.chip.bad{color:var(--red);border-color:#efc1b9;background:var(--red-soft);}
.chip.good{color:var(--green);border-color:#bcd6cf;background:var(--green-soft);}
.hits{display:grid;gap:12px;margin-top:14px;}
.hit{
  border:1px solid var(--line);border-left-width:5px;border-radius:2px;
  background:#fff;padding:13px 16px;
}
.hit.bad{border-left-color:var(--red);}
.hit.good{border-left-color:var(--green);}
.hit-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.hit-top h3{margin:0;font-size:17px;letter-spacing:.03em;}
.tag{font-size:11px;padding:1px 8px;border-radius:2px;letter-spacing:.06em;font-weight:700;}
.tag.bad{background:var(--red);color:#fff;}
.tag.good{background:var(--green);color:#fff;}
.tag.lv{background:#efeadd;color:var(--ink-soft);font-weight:500;}
.hit p{margin:6px 0 0;font-size:13.5px;color:var(--ink-soft);}
.hit p b{color:var(--ink);font-weight:600;}
.hit .eg{font-size:13px;color:#8b8474;}
.warnbox{
  margin-top:14px;padding:12px 16px;border:1px dashed #e0a79e;background:#fff6f4;
  font-size:13.5px;color:#8d3529;border-radius:2px;
}
.empty{
  margin-top:20px;padding:22px;text-align:center;border:1px dashed var(--line);
  color:var(--ink-soft);font-size:14px;background:#fff;border-radius:2px;
}

/* ===== 词库 ===== */
.lib{margin-top:44px;}
.tabs{display:flex;gap:8px;margin:16px 0 14px;flex-wrap:wrap;}
.tab{
  border:1px solid var(--line);background:#fff;padding:8px 18px;border-radius:2px;
  font:inherit;font-size:14px;cursor:pointer;letter-spacing:.04em;color:var(--ink-soft);
}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700;}
.tab.on.bad{background:var(--red);border-color:var(--red);}
.searchbar{position:relative;margin-bottom:16px;}
.searchbar input{
  width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:2px;background:#fff;
  font:inherit;font-size:14px;outline:none;
}
.searchbar input:focus{border-color:var(--ink);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;}
.item{
  background:#fff;border:1px solid var(--line);border-top:3px solid var(--green);
  padding:13px 15px;border-radius:2px;transition:box-shadow .15s,transform .15s;
}
.item:hover{box-shadow:6px 6px 0 rgba(29,28,26,.07);transform:translateY(-2px);}
.item.isbad{border-top-color:var(--red);}
.item .w{font-weight:800;font-size:16px;letter-spacing:.02em;}
.item .meta{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;margin:3px 0 8px;}
.item .meta i{font-style:normal;color:var(--ink);}
.item .d{font-size:13.5px;color:var(--ink-soft);line-height:1.7;}
.item .e{font-size:12.5px;color:#9a9282;margin-top:6px;}
.count{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;letter-spacing:.04em;}

/* ===== 弹窗 ===== */
.mask{
  position:fixed;inset:0;background:rgba(24,22,19,.55);backdrop-filter:blur(3px);
  display:none;place-items:center;padding:20px;z-index:60;
}
.mask.on{display:grid;animation:fade .2s ease;}
.alarm{
  width:min(520px,94vw);background:var(--paper-2);border:3px solid var(--red);
  border-radius:3px;box-shadow:0 24px 60px rgba(0,0,0,.35);padding:34px 26px 26px;text-align:center;
  position:relative;animation:pop .32s cubic-bezier(.2,1.6,.4,1);
}
@keyframes pop{0%{transform:scale(.86) rotate(-1deg);opacity:0;}100%{transform:none;opacity:1;}}
.alarm .bell{font-size:34px;line-height:1;margin-bottom:10px;}
.alarm h2{
  font-size:clamp(22px,4.6vw,31px);margin:0;color:var(--red);letter-spacing:.08em;
  font-family:"Songti SC","STSong","Noto Serif SC",serif;font-weight:900;
}
.alarm .sub{font-size:13px;color:var(--ink-soft);margin-top:10px;letter-spacing:.04em;}
.alarm .list{
  text-align:left;margin:18px 0 4px;background:#fff;border:1px solid #efd6d1;
  max-height:200px;overflow:auto;padding:10px 14px;font-size:13px;color:#7c3027;
}
.alarm .list div{padding:3px 0;border-bottom:1px dashed #f3e2de;}
.alarm .list div:last-child{border-bottom:none;}
.alarm .btn{margin-top:18px;}
.alarm .close{
  position:absolute;right:10px;top:6px;border:1px solid var(--line);background:#fff;
  width:30px;height:30px;border-radius:50%;font-size:19px;line-height:1;
  color:#6b6659;cursor:pointer;padding:0;
}
.alarm .close:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
footer{
  margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
  font-size:12px;color:#9a9282;letter-spacing:.05em;text-align:center;
}
@media(max-width:560px){
  .hero{padding:44px 0 30px;}
  .logo{gap:10px;}
  .brand{letter-spacing:.03em;}
  .stats{gap:8px;}
  .stat{padding:8px 14px;min-width:96px;}
}
</style>
</head>

/* ===== 建立词条索引 ===== */
const TERMS = [];
function addTerms(item, type){
  (item.k || [item.w]).forEach(t=>{ if(t && t.length) TERMS.push({t:t, type:type, item:item}); });
}
GOOD_DATA.forEach(it=>addTerms(it,"good"));
BAD_DATA.forEach(it=>addTerms(it,"bad"));
TERMS.sort((a,b)=>b.t.length-a.t.length);


/* ===== 文本扫描 ===== */
function scanText(text){
  const hits = [], seen = new Set();
  let i = 0;
  const marks = [];
  while(i < text.length){
    let found = null;
    for(const t of TERMS){
      if(text.startsWith(t.t, i)){ found = t; break; }
    }
    if(found){
      marks.push({start:i, end:i+found.t.length, type:found.type});
      const key = found.item.w;
      if(!seen.has(key)){ seen.add(key); hits.push(found); }
      i += found.t.length;
    } else {
      i += 1;
    }
  }
  return {hits:hits, marks:marks};
}

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ===== 渲染结果 ===== */
const $ = id=>document.getElementById(id);

function render(record){
  const text = $("input").value.trim();
  const box = $("result");
  if(!text){ box.className="result"; box.innerHTML=""; return; }

  const {hits, marks} = scanText(text);

  /* 原文高亮 */
  let html = "", pos = 0;
  marks.forEach(m=>{
    html += esc(text.slice(pos, m.start));
    const cls = m.type==="bad" ? "bad" : "good";
    html += '<span class="mk '+cls+'">'+esc(text.slice(m.start,m.end))+'</span>';
    pos = m.end;
  });
  html += esc(text.slice(pos));

  const badHits = hits.filter(h=>h.type==="bad");
  const goodHits = hits.filter(h=>h.type==="good");

  let out = '<div class="sentence">'+html+'</div>';
  out += '<div class="sum-bar">';
  out += '<span class="chip bad">不良烂梗 '+badHits.length+' 处</span>';
  out += '<span class="chip good">规范热梗 '+goodHits.length+' 处</span>';
  out += '</div>';

  if(hits.length === 0){
    out += '<div class="empty">没有识别到词库里的梗，语言干净得像刚洗过。</div>';
  } else {
    out += '<div class="hits">';
    hits.forEach(h=>{
      const it = h.item;
      const cls = h.type==="bad" ? "bad" : "good";
      const amb = (h.type==="bad" && it.amb);
      out += '<div class="hit '+cls+'">'
        + '<div class="hit-top"><h3>'+esc(it.w)+'</h3>'
        + '<span class="tag '+cls+'">'+(h.type==="bad"?"烂梗":"热梗")+'</span>'
        + '<span class="tag lv">'+esc(it.lv)+'</span>'
        + '<span class="tag lv">'+esc(it.cat)+'</span></div>'
        + '<p><b>释义：</b>'+esc(it.def)+'</p>'
        + '<p class="eg">例：'+esc(it.eg)+'</p>'
        + (amb ? '<p style="color:#b06a20"><b>语境提示：</b>该词本身可能用于正常表达，请结合上下文判断。</p>' : '')
        + '</div>';
    });
    out += '</div>';
  }

  if(badHits.length){
    out += '<div class="warnbox">检测到 '+badHits.length+' 处不良烂梗：「'+badHits.map(h=>esc(h.item.w)).join("、")
      + '」。这些词带有侮辱、诅咒、低俗或歧视意味，建议换成更规范的表达。</div>';
  }

  box.className = "result on";
  box.innerHTML = out;

  if(badHits.length){
    showAlarm(badHits, goodHits.length);
    if(record) bumpCounter(1);
  }
}

/* ===== 弹窗 ===== */
let blockedTotal = 0;
function showAlarm(badHits, goodCount){
  $("alarmSub").textContent = "这段文字里有 "+badHits.length+" 处不良烂梗"+(goodCount?"，另有 "+goodCount+" 处正常热梗不受影响":"")+"。";
  $("alarmList").innerHTML = badHits.map(h=>
    '<div><b>'+esc(h.item.w)+'</b>（'+esc(h.item.cat)+'）：'+esc(h.item.def)+'</div>'
  ).join("");
  $("mask").classList.add("on");
}
function hideAlarm(){ $("mask").classList.remove("on"); }

function bumpCounter(n){
  blockedTotal += n;
  $("statBlocked").textContent = blockedTotal;
}


/* ===== 词库渲染 ===== */
let sheet = "good";
function renderGrid(){
  const q = $("q").value.trim().toLowerCase();
  const data = sheet==="good" ? GOOD_DATA : BAD_DATA;
  const list = data.filter(it=>{
    if(!q) return true;
    return (it.w+" "+it.def+" "+it.cat+" "+it.lv+" "+it.eg).toLowerCase().indexOf(q)>=0;
  });
  $("count").textContent = "共 "+list.length+" 条"+(q?"（含关键词“"+q+"”）":"");
  $("grid").innerHTML = list.map(it=>
    '<div class="item '+(sheet==="bad"?"isbad":"")+'">'
    + '<div class="w">'+esc(it.w)+'</div>'
    + '<div class="meta"><i>'+esc(it.lv)+'</i> · '+esc(it.cat)+'</div>'
    + '<div class="d">'+esc(it.def)+'</div>'
    + '<div class="e">例：'+esc(it.eg)+'</div>'
    + '</div>'
  ).join("") || '<div class="empty" style="grid-column:1/-1">没有找到匹配的词条。</div>';
}

/* ===== 事件 ===== */
$("scan").addEventListener("click", ()=>render(true));
$("clear").addEventListener("click", ()=>{ $("input").value=""; $("result").className="result"; $("result").innerHTML=""; });
$("demo").addEventListener("click", ()=>{
  $("input").value = "这波操作YYDS，绝绝子！可评论区有人刷“没马”“你个伞兵”，还有人拿“唐人”嘲同学，看着真下头。";
  render(true);
});
$("closeAlarm").addEventListener("click", hideAlarm);
$("alarmOk").addEventListener("click", hideAlarm);
$("mask").addEventListener("click", e=>{ if(e.target===$("mask")) hideAlarm(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") hideAlarm(); });

$("q").addEventListener("input", renderGrid);
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    sheet = btn.dataset.sheet;
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b===btn));
    renderGrid();
  });
});

/* 边输边检（防抖） */
let timer = null;
$("input").addEventListener("input", ()=>{
  clearTimeout(timer);
  timer = setTimeout(()=>{
    const v = $("input").value.trim();
    if(v.length >= 2) render(false); else { $("result").className="result"; $("result").innerHTML=""; }
  }, 420);
});

/* 初始化 */
$("statGood").textContent = GOOD_DATA.length;
$("statBad").textContent = BAD_DATA.length;
$("statBlocked").textContent = "0";
renderGrid();
</script>
</body>
</html>
